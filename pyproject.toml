[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-lite"
version = "0.1.0"
description = "SAGE-Lite: Shared-Attention Gated Experts for Crack Segmentation"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Truong" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.21.0",
    "albumentations>=1.3.0",
    "pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "scipy>=1.7.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "h5py>=3.7.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "tqdm>=4.64.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sage*"]
