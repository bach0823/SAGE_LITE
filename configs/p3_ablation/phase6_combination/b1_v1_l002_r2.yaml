# ==============================================================================
# SAGE-Lite Phase 6 Combination — Stage 1A: B1-v1 (AB-BPL lambda=0.020, r=2)
# ==============================================================================
model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 8
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
stage2_sage_lr: 1e-4
output_dir: "results/runs/phase6_comb_b1_v1"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Objective Probe: AB-BPL
ab_bpl_weight: 0.020
ab_bpl_dilation: 2
boundary_iou_weight: 0.0

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "datasets/Crack500_ready"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
