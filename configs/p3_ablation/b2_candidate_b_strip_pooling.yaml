# ==============================================================================
# SAGE-Lite B2 Ablation: Candidate B, No ASDW, Oriented Strip Pooling
# ==============================================================================
# Model Architecture: B2 UNet (Depth 4: 4 CNN stages + 4 ViT blocks = 8 experts)
# Detail/Enhancement: NO ASDW (p3_mode="A" -> Identity, 0 ASDW params, zero overhead)
# Routing: top_k = 2 (25% capacity), router_hidden_dim = 64, gating = sigmoid, logit_mod = True
# Fusion Mechanism: Pure Residual Fusion (residual_scale = 0.1)
# Structural Context Module: Oriented Strip Pooling at Block 1 (56x56, 96 channels):
#     - Gate: learned per-pixel sigmoid gate g(x, y) mixing horizontal (1, W) and vertical (H, 1) pools
#     - Residual connection: x + fusion(g * conv_h(y_h) + (1-g) * conv_v(y_v))
# Protocol: Pure Two-Stage (35 epochs: Stage 1 = 17, Stage 2 = 18, BS14, 448x448, seed=42)
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "A"
use_cgsr: false
cgsr: false
use_point_rend: false
use_oriented_strip_pooling: true
use_tangent_head: false
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/runs/CandidateB_StripPooling"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
