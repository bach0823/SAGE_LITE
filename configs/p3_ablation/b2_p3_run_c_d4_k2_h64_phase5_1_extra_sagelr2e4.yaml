# ==============================================================================
# SAGE-Lite B2 Proposal 3 (P3) Ablation Study — Phase 5.1 Extra (Stage 2 SAGE LR = 2e-4)
# ==============================================================================
# Role: Phase 5.1 Extra — Stage-2 Isolated SAGE LR Controlled Verification
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW (Identical to Candidate B)
# Routing: top_k = 2, router_hidden_dim = 64, load_balance_factor = 0.01 (Identical)
# Protocol: Inherits Candidate B Stage 1 checkpoint, runs Stage 2 (BS14, img_size 448, seed 42)
# Independent Variable: stage2_sage_lr = 2e-4 (vs Candidate B baseline stage2_sage_lr = 1e-4)
# Invariants: stage2_base_lr = 1e-4, stage2_shared_lr = 1e-4, stage2_p3_lr = 1e-4
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_sage_lr: 2e-4
stage2_p3_lr: 1e-4
output_dir: "/content/drive/MyDrive/crack_seg/P3_C_Phase5_1_Extra_Stage2_SAGELR2e-4"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
