# ==============================================================================
# SAGE-Lite Phase 6-A.2: Representation Probe — Progressive Learned Upsampling (PLU-Head)
# ==============================================================================
# Role: Phase 6-A.2 Representation Probe (Controlled Minimal Intervention: +6,408 params)
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW (Identical to Candidate B / 6-A.1)
# Routing: top_k = 2, router_hidden_dim = 64, load_balance_factor = 0.010 (Frozen)
# Optimization: Stage 2 resumption from Candidate B Stage 1 checkpoint (best_model_b2_stage1.pth)
#               Base LR = 1e-4, Shared LR = 1e-4 (r = 1.00), P3 LR = 1e-4, Warmup = 3, Patience = 6
# Objective: L_total = L_Base_Seg (1.0*BCE + 1.5*Dice) + 1.0*L_LB + 0.50*L_B-IoU (Locked from 6-A.1)
# Single-Variable Intervention:
#   use_plu_head: true
#   Replaces 112x112 1x1 conv + 4x bilinear upsample with:
#     48x112^2 -> Conv 48->24 -> BN/ReLU -> ConvTranspose 24->16 (k=4, s=2, p=1) -> BN/ReLU
#     -> ConvTranspose 16->1 (k=4, s=2, p=1) -> 448^2.
#   Delta Params: exactly +6,408 (+0.0633% vs Candidate B baseline).
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/runs/P3_C_Phase6_A2_PLU_D4_K2_H64"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Representation Probe Flag
use_plu_head: true

# Phase 6 Objective (Locked from 6-A.1)
boundary_iou_weight: 0.5
boundary_iou_dilation: 2

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
