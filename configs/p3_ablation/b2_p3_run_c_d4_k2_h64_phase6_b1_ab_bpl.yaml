# ==============================================================================
# SAGE-Lite Phase 6-B.1: Boundary Margin Probe — Asymmetric Boundary-Band Penalty Loss (AB-BPL)
# ==============================================================================
# Role: Phase 6-B.1 Objective Probe (Zero extra parameters, Architecture 100% frozen)
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW (Identical to Candidate B)
# Routing: top_k = 2, router_hidden_dim = 64, load_balance_factor = 0.010
# Optimization: Stage 2 resumption from Candidate B Stage 1 checkpoint
#               Base LR = 1e-4, Shared LR = 1e-4 (r = 1.00), P3 LR = 1e-4
# Objective: L_total = L_Base_Seg (1.0*BCE + 1.5*Dice) + 1.0*L_LB + lambda_margin * L_AB-BPL
# Pre-locked Hyperparameters:
#   ab_bpl_weight (lambda_margin): 0.040 (calibrated at Candidate B Stage-1 probe point)
#   ab_bpl_dilation (r): 2 (kernel_size = 5x5)
#   boundary_iou_weight: 0.0 (BoundaryIoU strictly OFF)
# Target Failure Chains:
#   1. Boundary-margin error (n=127, currently +14.86% sample-mean pred area excess, precision 0.7452)
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/drive/MyDrive/crack_seg/P3_C_Phase6_B1_AB_BPL_D4_K2_H64"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Phase 6-B.1 Objective Probe Hyperparameters (Frozen Ex-Ante)
ab_bpl_weight: 0.040
ab_bpl_dilation: 2
boundary_iou_weight: 0.0

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
