# ==============================================================================
# SAGE-Lite B2 Phase 6E — Diagnostic A Probe: PointRend Decoder Refinement Head
# ==============================================================================
# Role: Diagnostic A Probe for Uncertainty-Driven High-Resolution Refinement
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), Candidate B Protocol + PointRend
# Routing: top_k = 2 (25% pool capacity), router_hidden_dim = 64, load_balance = 0.01
# Protocol: 35 epochs (Stage 1 = 17, Stage 2 = 18, patience = 6, BS14, img_size 448)
# Optimization: Stage 2 starts fresh from Candidate B Stage 1 Checkpoint
# PointRend: TRUE
# Point Loss Weight: 1.0 (BCE on 2048 sampled uncertain points)
# Training Points: 2048 (75% uncertain + 25% uniform)
# Subdivision Points: 8192 (inference refinement)
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
use_cgsr: false
use_plu_head: false

use_point_rend: true
point_loss_weight: 1.0
point_rend_train_points: 2048
point_rend_subdivision_points: 8192
point_rend_mid_channels: 128
checkpoint: "results/checkpoints/P3_C_D4_K2_H64_Phase5_SAGELR2e-4_best_model_b2_stage1.pth"

seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/drive/MyDrive/crack_seg/Phase6E_PointRend"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
