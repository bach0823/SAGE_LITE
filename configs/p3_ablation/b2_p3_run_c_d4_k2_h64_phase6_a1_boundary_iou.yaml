# ==============================================================================
# SAGE-Lite Phase 6-A.1: Objective Probe — Soft Boundary IoU Loss
# ==============================================================================
# Role: Phase 6-A.1 Objective Probe (Zero extra parameters, Architecture 100% frozen)
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW (Identical to Candidate B)
# Routing: top_k = 2, router_hidden_dim = 64, load_balance_factor = 0.010
# Optimization: Stage 2 resumption from Candidate B Stage 1 checkpoint
#               Base LR = 1e-4, Shared LR = 1e-4 (r = 1.00), P3 LR = 1e-4
# Objective: L_total = L_Base_Seg (1.0*BCE + 1.5*Dice) + 1.0*L_LB + lambda_b * L_B-IoU
# Pre-locked Hyperparameters:
#   boundary_iou_weight (lambda_b): 0.50
#   boundary_iou_dilation (d): 2 (kernel_size = 5x5)
# Target Failure Chains:
#   1. Boundary-margin error (n=127, currently +5.85% pred area, precision 0.7452)
#   2. Thin crack / high-frequency failure (n=66 with thinness > 0.20, n=5 low area)
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/drive/MyDrive/crack_seg/P3_C_Phase6_A1_BoundaryIoU_D4_K2_H64"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Phase 6-A.1 Objective Probe Hyperparameters (Locked Ex-Ante)
boundary_iou_weight: 0.5
boundary_iou_dilation: 2

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
