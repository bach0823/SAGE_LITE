# ==============================================================================
# SAGE-Lite Phase 6: Full Combination 1 (A1* + B1*) Trained from Stage 1 (35 Epochs)
# ==============================================================================
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW
# Head: Bilinear 4x upsampling
# Objectives:
#   - A1* (SoftBIoU): lambda = 0.50, dilation = 2
#   - B1* (AB-BPL):   lambda = 0.040, dilation = 2
# Training Protocol:
#   - Full Two-Stage from scratch (ImageNet pretrained backbone)
#   - Stage 1: 17 epochs (Warmup = 3, LR: base=1e-4, sage=2e-4, p3=1e-4)
#   - Stage 2: 18 epochs (Stage 2 LR: base=1e-4, shared=1e-4, p3=1e-4, sage=1e-4)
#   - Total: 35 epochs, BS=14, img_size=448
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 8
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
stage2_sage_lr: 1e-4
output_dir: "results/phase6_combination/phase6_comb_full35_a1_b1"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Representation Component (Bilinear Canonical Head)
use_plu_head: false

# Boundary Objective Component 1: SoftBIoU (A1*)
boundary_iou_weight: 0.50
boundary_iou_dilation: 2

# Boundary Objective Component 2: AB-BPL (B1*)
ab_bpl_weight: 0.040
ab_bpl_dilation: 2

# Controls
cldice_weight: 0.0

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "datasets/Crack500_ready"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
