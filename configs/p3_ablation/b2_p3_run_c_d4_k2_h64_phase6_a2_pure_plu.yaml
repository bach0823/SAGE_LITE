# ==============================================================================
# SAGE-Lite Phase 6-A.2: Pure PLU Representation Probe (Progressive Learned Upsampling)
# ==============================================================================
# Role: Phase 6-A.2 Pure PLU Representation Probe (Single Architectural Intervention)
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW (Identical to Candidate B / 6-A.1)
# Routing: top_k = 2, router_hidden_dim = 64, load_balance_factor = 0.010 (Frozen)
# Protocol: 35 epochs (Stage 1 = 17, Stage 2 = 18, patience = 6, BS14, img_size 448)
#           Full Stage 1 -> Stage 2 trained from pretrained initialization (scratch).
#           Candidate B Stage 1 checkpoint reuse and head remapping are strictly prohibited.
# Optimization:
#   Stage 1: lr: 1e-4 (backbone: 1e-5, decoder/PLU: 1e-4), sage_lr: 2e-4, p3_lr: 1e-4
#   Stage 2: stage2_base_lr: 1e-4, stage2_shared_lr: 1e-4, stage2_sage_lr: 1e-4, stage2_p3_lr: 1e-4
# Objective: Pure Base Loss (1.0*BCE + 1.5*Dice) across both Stage 1 and Stage 2
#   boundary_iou_weight: 0.0 (BoundaryIoU completely disabled; isolated in Phase 6-A.1)
# Single-Variable Intervention:
#   use_plu_head: true
#   Replaces 112x112 1x1 conv + 4x bilinear upsample with:
#     48x112^2 -> Conv 48->24 -> BN/ReLU -> ConvTranspose 24->16 (k=4, s=2, p=1) -> BN/ReLU
#     -> ConvTranspose 16->1 (k=4, s=2, p=1) -> 448^2.
#   Delta Params: exactly +6,408 (+0.0633% vs Candidate B baseline).
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/runs/P3_C_Phase6_A2_Pure_PLU_D4_K2_H64"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Representation Probe Flag
use_plu_head: true

# Objective: Pure Base Loss (BoundaryIoU strictly OFF for Pure PLU Isolation)
boundary_iou_weight: 0.0

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
