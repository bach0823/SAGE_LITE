# ==============================================================================
# SAGE-Lite B2 Proposal 3 (P3) Ablation Study — Run C D2 Configuration
# ==============================================================================
# Role: Run C — Full P3 (Anisotropic Strip Depthwise Refinement) under Depth 2
# Architecture: ASDW-Concat (1x7 + 7x1 + 3x3) -> Concat(3C) -> GELU -> PWConv(3C->C) -> Residual(gamma) -> AdaptiveAvgPool2d(28, 28) -> ViT
# Refinement Params: 37,874 total (S0: 8,017, S1: 29,857)
# Backbone Buffer: backbone.pe28_fixed (shape [1, 784, 192], float32)
# Protocol: 35 epochs (Stage 1 = 17, Stage 2 = 18, patience = 6, BS14, ASDW)
# Expert Pool: 6 experts (4 CNN stages + 2 ViT blocks)
# Routers: 6 injected hierarchical routers (4 CNN + 2 ViT) with top_k=4
# ==============================================================================

model: B2
num_transformer_layers: 2
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 6
two_stage: true
lr: 1e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
output_dir: "/content/P3_C_Canonical_Base_D2"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

sage_config:
  top_k: 4
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
