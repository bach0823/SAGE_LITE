# ==============================================================================
# SAGE-Lite Phase 6-D.1: Representation x Boundary Synergy Probe (PLU + AB-BPL)
# ==============================================================================
# Role: Phase 6-D.1 Controlled Synergy Probe (Architectural + Objective Pair)
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW + PLU Head (10,125,363 params)
# Representation Component:
#   use_plu_head: true (Replaces 1x1 conv + 4x bilinear upsample with Progressive Learned Upsampling)
# Boundary Objective Component:
#   ab_bpl_weight (lambda_margin): 0.040 (Asymmetric Boundary-Band Penalty Loss, r=2)
# Routing: top_k = 2, router_hidden_dim = 64, load_balance_factor = 0.010 (Frozen)
# Protocol: Stage 2 only (18 epochs, patience = 8, BS14, img_size 448)
# Lineage Provenance:
#   Strictly branched from Phase 6-A.2 Stage 1 checkpoint:
#     Model Weights: best_model_b2_stage1.pth (Phase 6-A.2 Pure PLU)
#     RNG / Scaler:  last_model_b2_stage1.pth (Phase 6-A.2 Pure PLU)
# Control Group:
#   Pure A2 Stage 2 (Base Loss only, same Stage 1 checkpoint & RNG state)
# Pre-registered Invariants:
#   boundary_iou_weight: 0.0 (OFF)
#   cldice_weight: 0.0 (OFF)
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 8
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/drive/MyDrive/crack_seg/P3_C_Phase6_D1_PLU_ABBPL_D4_K2_H64"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Representation Component (A2 PLU Head)
use_plu_head: true

# Boundary Objective Component (B1 AB-BPL)
ab_bpl_weight: 0.040
ab_bpl_dilation: 2

# Isolated Controls (Strictly OFF)
boundary_iou_weight: 0.0
cldice_weight: 0.0

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
