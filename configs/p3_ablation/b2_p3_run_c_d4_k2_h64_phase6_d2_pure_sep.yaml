# ==============================================================================
# SAGE-Lite Phase 6-D.2: Pure Inter-Component Separation Isolation Probe (Negative Moat)
# ==============================================================================
# Role: Phase 6-D.2 Mechanism Probe (Single-Variable Objective Intervention on Baseline)
# Architecture: D4 (4 CNN + 4 ViT = 8 experts), P3-C ASDW (Identical to Candidate B Baseline)
# Representation Component:
#   use_plu_head: false (100% frozen Candidate B architecture, 10,118,955 params)
# Boundary / Separation Objective Component:
#   separation_weight (lambda_sep): 0.010 (calibrated at 5.0% Base gradient budget)
#   separation_max_gap (G_max): 8.0 (data-driven pair selection cutoff)
#   separation_min_area: 5 (filter noise artifacts)
# Isolated Controls (Strictly OFF):
#   ab_bpl_weight: 0.0 (AB-BPL OFF)
#   boundary_iou_weight: 0.0 (Boundary-IoU OFF)
#   cldice_weight: 0.0 (Soft-clDice OFF)
# Routing: top_k = 2, router_hidden_dim = 64, load_balance_factor = 0.010 (Frozen)
# Protocol: Stage 2 only (18 epochs, patience = 8, BS14, img_size 448)
# Lineage Provenance:
#   Strictly branched from Candidate B Stage 1 checkpoint:
#     Model Weights: P3_C_D4_K2_H64_Phase5_SAGELR2e-4_best_model_b2_stage1.pth
#     RNG / Scaler:  P3_C_D4_K2_H64_Phase5_SAGELR2e-4_last_model_b2_stage1.pth
# Primary Readout:
#   FalseBridge Count (N_bridge <= 105, NetChange <= -5), Cured, Created
# Guardrails:
#   Breakage (<= 9.5%), Thin Dice (>= 0.6400), Global Dice (>= 0.7640), Recall (>= 0.8400)
# ==============================================================================

model: B2
num_transformer_layers: 4
p3_mode: "C"
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 8
two_stage: true
lr: 1e-4
sage_lr: 2e-4
p3_lr: 1e-4
gamma_init: 0.01
stage2_base_lr: 1e-4
stage2_shared_lr: 1e-4
stage2_p3_lr: 1e-4
output_dir: "/content/drive/MyDrive/crack_seg/P3_C_Phase6_D2_Pure_Sep_D4_K2_H64"
mask_suffix: ""
smart_filter: true
crop_mode: "random"

# Architecture: Candidate B Baseline (No PLU)
use_plu_head: false

# Objective: Explicit Inter-Component Separation Supervision (Phase 6-D.2)
separation_weight: 0.010
separation_max_gap: 8.0
separation_min_area: 5

# Isolated Controls (Strictly OFF)
ab_bpl_weight: 0.0
boundary_iou_weight: 0.0
cldice_weight: 0.0

sage_config:
  top_k: 2
  gating_type: "sigmoid"
  shared_expert_indices: [0, 1, 2, 3]
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: "residual"
  residual_scale: 0.1

root_dir: "/content/dataset/Crack500"

train:
  images: "train/images"
  masks: "train/masks"

val:
  images: "val/images"
  masks: "val/masks"

test:
  images: "test/images"
  masks: "test/masks"
